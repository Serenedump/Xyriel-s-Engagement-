  else{o.id="l"+o.at;list.push(o);saveL();comp=false;draw()}return}
 var a=t.getAttribute&&t.getAttribute("data-a"),i=t.getAttribute&&t.getAttribute("data-i");if(!a)return;
 var n=list.filter(function(x){return x.id===i})[0];if(!n)return;
 if(a==="del"){if(!confirm("Delete this announcement?"))return;
  if(online)db.collection("en_board").doc(i).delete().catch(function(er){console.error(er);alert("Could not delete.")});else{list=list.filter(function(x){return x.id!==i});saveL();draw()}}
 if(a==="pin"){if(online)db.collection("en_board").doc(i).update({pin:!n.pin}).catch(function(er){console.error(er);alert("Could not update.")});else{n.pin=!n.pin;saveL();draw()}}
});
draw();
var iv=setInterval(function(){try{if(online&&db){clearInterval(iv);subscribe();draw()}}catch(e){}},600);
})();
</script>
